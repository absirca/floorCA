<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Floor Management System V5.0</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
<style>
:root{--bg:#0e1320;--card:#1b2438;--line:#2b3752;--txt:#e8eefb;--muted:#8b9ab5;--acc:#5b8cff;--ok:#2ecc8f;--warn:#ffb020;--bad:#ff5c6c}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:1400px;margin:0 auto;padding:0 14px}
.topbar{background:linear-gradient(180deg,#182136,#131a29);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.topbar .wrap{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px}
.spacer{flex:1}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:#22304d;border:1px solid var(--line);font-size:12px}
.chip.ok{background:rgba(46,204,143,.15);border-color:var(--ok);color:var(--ok)}
.chip.warn{background:rgba(255,176,32,.15);border-color:var(--warn);color:var(--warn)}
.chip.bad{background:rgba(255,92,108,.15);border-color:var(--bad);color:var(--bad)}
.chip.info{background:rgba(91,140,255,.15);border-color:var(--acc);color:var(--acc)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0}
.tabs button{background:transparent;border:1px solid transparent;color:var(--muted)}
.tabs button.active{background:#22304d;border-color:var(--line);color:var(--txt);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
h2{margin:18px 0 12px;font-size:20px}
h3{font-size:15px}
.card h3{margin:0 0 10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:12px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th,table.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
table.tbl th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.scrollx{overflow-x:auto}
button{padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:#233049;color:var(--txt);cursor:pointer;font:inherit}
button:hover{filter:brightness(1.15)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.ok{background:var(--ok);border-color:var(--ok);color:#04281a;font-weight:600}
button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
button.ghost{background:transparent}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{background:#0f1626;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 9px;font:inherit}
label.chk{display:flex;align-items:center;gap:8px;margin:8px 0;cursor:pointer}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc)}
.warnnote{color:var(--warn);font-size:12.5px;margin:6px 0 10px;background:rgba(255,176,32,.08);border-left:3px solid var(--warn);padding:8px 10px;border-radius:0 8px 8px 0}
.oknote{color:var(--ok);font-size:12.5px;margin:6px 0 10px;background:rgba(46,204,143,.08);border-left:3px solid var(--ok);padding:8px 10px;border-radius:0 8px 8px 0}
.badnote{color:var(--bad);font-size:12.5px;margin:6px 0 10px;background:rgba(255,92,108,.08);border-left:3px solid var(--bad);padding:8px 10px;border-radius:0 8px 8px 0}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.loginwrap{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
.login{width:100%;max-width:400px}
.login label{display:block;margin:12px 0 5px;font-size:13px;color:var(--muted)}
.login input,.login select{width:100%}
.dot{width:10px;height:10px;border-radius:50%;background:#44506b;display:inline-block}
.dot.ok{background:var(--ok)}
.dot.bad{background:var(--bad)}
.dot.pending{background:var(--acc)}
.dot.syncing{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.syncwrap{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);cursor:pointer}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#22304d;border:1px solid var(--line);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:999;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.stat div{background:#101728;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:12px}
.stat b{display:block;font-size:18px}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}
.room-banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.room-banner h2{margin:0;font-size:22px}
.entry-card{background:#1b2438;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.entry-header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;cursor:pointer;user-select:none;background:#1b2438;transition:.15s}
.entry-header:hover{background:#202a41}
.entry-card.open .entry-header{background:#202a41;border-bottom:1px solid var(--line)}
.entry-name{font-weight:600;font-size:15px}
.entry-id{color:var(--muted);font-size:12px;font-family:ui-monospace,monospace;margin-top:2px}
.entry-score{font-size:18px;font-weight:700;color:var(--acc);margin-left:6px}
.entry-summary{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.entry-summary .chip{font-size:11px;padding:2px 8px}
.caret{color:var(--muted);font-size:14px;transition:.15s;display:inline-block}
.entry-card.open .caret{transform:rotate(90deg)}
.entry-body{padding:12px;display:none}
.entry-card.open .entry-body{display:block}
.entry-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:7px}
.entry-label{flex:0 0 110px;font-size:11px;color:var(--muted);padding-top:7px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.btn-group{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.btn-opt{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#131c2e;color:var(--muted);font-size:12px;white-space:nowrap;transition:.12s;user-select:none;cursor:default}
.btn-opt[data-clickable="1"]{cursor:pointer}
.btn-opt[data-clickable="1"]:hover{filter:brightness(1.3);border-color:var(--acc)}
.btn-opt.active{color:#fff;font-weight:600;border-color:transparent}
.btn-opt.active[data-tone="ok"]{background:var(--ok);color:#04281a}
.btn-opt.active[data-tone="warn"]{background:var(--warn);color:#2a1a00}
.btn-opt.active[data-tone="bad"]{background:var(--bad);color:#fff}
.btn-opt.active[data-tone="info"]{background:var(--acc);color:#fff}
.btn-opt.active[data-tone="muted"]{background:#44506b;color:#e8eefb}
.btn-opt[data-clickable=""]{opacity:.5}
.entry-note{flex:1;padding:6px 9px;font-size:12px;min-width:140px}
.entry-note.need{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.section-head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin:12px 0 6px;padding-top:10px;border-top:1px dashed var(--line)}
.section-head:first-child{margin-top:0;padding-top:0;border-top:none}
@media(max-width:640px){
  .entry-row{flex-direction:column;gap:4px}
  .entry-label{flex:0 0 auto;padding-top:0}
  .btn-opt{padding:7px 9px}
}
.big-edit{padding:12px 18px;font-size:14px;font-weight:600;border-radius:11px;background:var(--acc);border-color:var(--acc);color:#fff}
.quickbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;background:#131c2e;border:1px solid var(--line);padding:10px 12px;border-radius:12px}
.clean-block{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#131c2e;margin-bottom:10px}
.clean-block.missing{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.clean-block.notdone{border-color:var(--bad)}
.duty-select{flex:1;min-width:180px;padding:7px 9px;font-size:13px}
.duty-select.need{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.chk-item{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 0;border-bottom:1px dashed var(--line)}
.chk-item:last-child{border-bottom:none}
.chk-item .lbl{flex:0 0 150px;font-size:13px}
.streak{display:inline-flex;gap:3px;vertical-align:middle}
.streak i{width:10px;height:10px;border-radius:3px;background:#44506b;display:inline-block}
.streak i.ok{background:var(--ok)}
.streak i.bad{background:var(--bad)}
.streak i.na{background:#2b3752}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
/* =========================================================
   FLOOR MANAGEMENT SYSTEM — v9
   • Two-way auto sync (debounced push, queue, pull, merge)
   • Food: "Not eaten" → REQUIRES "what they don't eat";
     per-student persistent food restrictions
   • Cleaning: duty person ALWAYS required; status = Done / Not done
     (washroom, room, floor)
   • Discipline checklist for RCs (bed, cupboard, shoes, dustbin,
     lights/fan, windows, laundry, uniform, valuables, curfew, head-count)
   • Duty-repeat / non-completion tracking + 7-day streak
   • Login: reset bug fixed (no re-render on login screen)
   ========================================================= */
const GAS_URL='https://script.google.com/macros/s/AKfycbxDrzuq8tLkwojEkE5eg7djiaHjW0lG27VxlPuANP3qjPPHE75ErywgfWpOFGqQ5gnr/exec';
const LS='fms_v1';
const LS_OPEN='fms_openCards';
const LS_QUEUE='fms_dirty';
const LS_ROLE='fms_lastRole';
const LS_ROOM='fms_lastRoom';
const VERSION='v11';
const EXPECT_SERVER_V='v11';   /* must match the V constant in Code.gs — mismatch means an old deploy is still live */
const PULL_MS=20000;
let SYNC_TIMEOUT=window.__SYNC_TIMEOUT||20000;
const ROOMS=['301','302','303'];
const CLASSES=['6','7','8','9','10','11','12'];
const PRAYERS=[['fajr','Fajr'],['dhuhr','Dhuhr'],['asr','Asr'],['maghrib','Maghrib'],['isha','Isha']];

const STUDY_TIMES=[
  {k:'quran',l:'Quran'},{k:'pre_bf',l:'Pre-bf'},{k:'post_bf',l:'Post-bf'},
  {k:'midday',l:'Midday'},{k:'afternoon',l:'Afternoon'},{k:'evening',l:'Evening'},{k:'night',l:'Night'}
];
const MEALS=[{k:'breakfast',l:'Breakfast'},{k:'lunch',l:'Lunch'},{k:'dinner',l:'Dinner'}];
const SALAH_STATUS=[
  {v:'',l:'Not marked',short:'—',tone:'muted'},
  {v:'rakat1',l:'Attended from Rakat 1',short:'R1',tone:'ok'},
  {v:'middle',l:'Joined in the middle',short:'Mid',tone:'warn'},
  {v:'floor_late',l:'In floor (late)',short:'Flr·L',tone:'info'},
  {v:'floor_space',l:'In floor (no space)',short:'Flr·S',tone:'info'},
  {v:'alone',l:'Alone in the room',short:'Alone',tone:'warn'},
  {v:'not_completed',l:'Not completed',short:'✗',tone:'bad'},
  {v:'na',l:'N/A (leave / sick)',short:'N/A',tone:'muted'}
];
const STUDY_LOC=[
  {v:'',l:'Not marked',short:'—',tone:'muted'},
  {v:'reading_room',l:'Reading room',short:'📖',tone:'ok'},
  {v:'bed',l:'Bed',short:'🛏',tone:'warn'},
  {v:'room_study',l:'Room study',short:'📚',tone:'ok'},
  {v:'other_floor',l:'Other floor',short:'🏢',tone:'info'}
];
const ACTIVITY=[
  {v:'',l:'Not marked',short:'—',tone:'muted'},
  {v:'self_study',l:'Self study',short:'📖 Study',tone:'ok'},
  {v:'sleeping',l:'Sleeping',short:'😴 Sleep',tone:'info'},
  {v:'outside',l:'Outside',short:'🌳 Out',tone:'warn'},
  {v:'playing',l:'Playing',short:'⚽ Play',tone:'warn'},
  {v:'sick',l:'Sick',short:'🤒 Sick',tone:'bad'},
  {v:'competition',l:'Competition',short:'🏆 Comp',tone:'info'},
  {v:'leave',l:'On leave',short:'🚪 Leave',tone:'muted'},
  {v:'class',l:'In class / school',short:'🎓 Class',tone:'info'}
];
const FOOD_OPTS=[
  {v:'eaten',l:'Eaten',short:'🍽 Eaten',tone:'ok'},
  {v:'not_eaten',l:'Not eaten',short:'🚫 Not eaten',tone:'bad'}
];
const CLEAN_STATUS=[
  {v:'',l:'Not confirmed',short:'— Not confirmed',tone:'muted'},
  {v:'done',l:'Done',short:'✓ Done',tone:'ok'},
  {v:'not_done',l:'Not done',short:'✗ Not done',tone:'bad'}
];
const CHECK_STATUS=[
  {v:'',l:'Not checked',short:'—',tone:'muted'},
  {v:'ok',l:'OK',short:'✓ OK',tone:'ok'},
  {v:'issue',l:'Issue',short:'✗ Issue',tone:'bad'}
];
/* Discipline checks done by the Room Captain */
const DISCIPLINE=[
  {k:'beds',      l:'Beds made & tidy'},
  {k:'cupboards', l:'Cupboards / lockers tidy'},
  {k:'shoes',     l:'Shoes arranged on rack'},
  {k:'dustbin',   l:'Dustbin emptied'},
  {k:'floorSwept',l:'Room floor swept / mopped'},
  {k:'windows',   l:'Windows & curtains in order'},
  {k:'lights',    l:'Lights / fans off when empty'},
  {k:'laundry',   l:'Laundry & clothes managed'},
  {k:'uniform',   l:'Uniform / dress code proper'},
  {k:'valuables', l:'No mobile / banned items'},
  {k:'curfew',    l:'All in room at lights-out'},
  {k:'headcount', l:'Head-count done'}
];
const EQUIP=[['harpic','Harpic'],['handwash','Handwash'],['toothpaste','Toothpaste'],['odonil','Odonil']];
const FLOOR_GOODS=[['harpic','Harpic'],['handwash','Handwash'],['toothpaste','Toothpaste'],['odonil','Odonil'],
  ['tissue','Tissue roll'],['phenyl','Phenyl'],['broom','Broom'],['soap','Hand soap']];
/* Floor-level checks done by the Floor Captain */
const FLOOR_CHECKS=[
  {k:'corridor', l:'Corridor clean'},
  {k:'stairs',   l:'Stairs / landing clean'},
  {k:'drinking', l:'Drinking water available'},
  {k:'dustbins', l:'Floor dustbins emptied'},
  {k:'lights',   l:'Corridor lights working'},
  {k:'fans',     l:'Fans / exhaust in order'},
  {k:'noise',    l:'Silence maintained'}
];

const TABS={
  rc:    [['entry','Daily Entry'],['confirm','Status'],['roster','Roster'],['reports','My Marks']],
  fc:    [['overview','Overview'],['confirm','Confirm'],['goods','Floor Duty'],['entry','Inspect Rooms']],
  fcom:  [['overview','Overview'],['confirm','Verify'],['entry','Edit Entries'],['reports','Reports']],
  admin: [['overview','Overview'],['entry','Daily Entry'],['confirm','Verify'],['goods','Floor Duty'],['reports','Reports'],['admin','Admin']]
};

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function todayStr(){return fmtDate(new Date());}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(s,n){const d=parseDate(s);d.setDate(d.getDate()+n);return fmtDate(d);}
function diffDays(a,b){return Math.round((parseDate(b)-parseDate(a))/86400000);}
function prettyDate(s){return parseDate(s).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short',year:'numeric'});}
function mondayOf(d){const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return fmtDate(x);}
function nowStamp(){return new Date().toLocaleString();}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.style.borderColor=kind==='bad'?'var(--bad)':kind==='ok'?'var(--ok)':'var(--line)';t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800);}
function studentName(id){
  for(const r of ROOMS){const s=(S.rooms[r]&&S.rooms[r].students||[]).find(x=>x.id===id);if(s)return s.name;}
  return id||'—';
}

/* ---------- collapse state ---------- */
let openCards={};
try{openCards=JSON.parse(lsGet(LS_OPEN,'{}'));}catch(e){openCards={};}
function saveOpenCards(){lsSet(LS_OPEN,JSON.stringify(openCards));}
function cardKey(room,sid){return room+'||'+sid;}
function isCardOpen(room,sid){return !!openCards[cardKey(room,sid)];}
function toggleCard(room,sid){const k=cardKey(room,sid);openCards[k]=!openCards[k];saveOpenCards();render();}
function openAllCards(room){for(const s of S.rooms[room].students)openCards[cardKey(room,s.id)]=true;saveOpenCards();render();}
function closeAllCards(room){for(const s of S.rooms[room].students)delete openCards[cardKey(room,s.id)];saveOpenCards();render();}

/* ---------- state ---------- */
let S=null,session=null,currentDate=todayStr(),view='overview',activeRoom='301';
let repFrom=addDays(todayStr(),-6),repTo=todayStr();

function defaultUsers(){
  return {
    admin:{name:'Floor Incharge',pin:'1122'},
    fc:{name:'Floor Captain',pin:'1122',studentId:''},
    fcom:{name:'Floor Commander',pin:'1122',studentId:''},
    rc:{'301':'1122','302':'1122','303':'1122'}
  };
}
function defaultState(){
  const rooms={};
  const counts={'301':6,'302':6,'303':8};
  for(const r of Object.keys(counts)){
    const students=[];
    const half=Math.ceil(counts[r]/2);
    for(let i=1;i<=counts[r];i++){
      const id=r+'-'+String(i).padStart(2,'0');
      students.push({id,name:'Student '+id,class:i<=half?'9':'10',avoid:''});
    }
    rooms[r]={students,rotation:students.map(s=>s.id)};
  }
  return {rooms,days:{},users:defaultUsers(),
    settings:{sheetUrl:GAS_URL,autoSync:true,rotationStart:mondayOf(new Date())},
    meta:{version:VERSION,lastSync:null,lastConfigSync:null,lastPull:null,cfgTs:0}};
}

/* ---------- migrations ---------- */
function migrateCleaning(c){
  if(!c)c={};
  if(typeof c.washroom!=='object'||c.washroom===null)c.washroom={status:c.washroom===true||c.washroomCleaned?'done':'',dutyBy:c.washroomBy||''};
  if(typeof c.room!=='object'||c.room===null)c.room={status:c.room===true||c.roomCleaned?'done':'',dutyBy:c.roomBy||''};
  ['washroom','room'].forEach(k=>{
    if(c[k].status===undefined)c[k].status='';
    if(c[k].dutyBy===undefined)c[k].dutyBy='';
    if(c[k].note===undefined)c[k].note='';
  });
  ['harpic','handwash','toothpaste','odonil'].forEach(k=>{if(typeof c[k]!=='boolean')c[k]=false;});
  delete c.washroomCleaned;delete c.washroomBy;delete c.roomCleaned;delete c.roomBy;
  return c;
}
function migrateFloorDay(f){
  if(!f)f={};
  if(!f.goods)f.goods={};
  FLOOR_GOODS.forEach(([k])=>{if(typeof f.goods[k]!=='boolean')f.goods[k]=false;});
  if(typeof f.floorCleaning!=='object'||f.floorCleaning===null)f.floorCleaning={status:'',dutyBy:'',note:''};
  if(f.floorCleaning.note===undefined)f.floorCleaning.note='';
  if(!f.checks)f.checks={};
  if(f.goodsBy===undefined)f.goodsBy='';
  if(f.goodsNote===undefined)f.goodsNote='';
  return f;
}
function migrateConfig(){
  if(!S.meta)S.meta={};
  S.meta.version=VERSION;
  if(!S.meta.cfgTs)S.meta.cfgTs=0;
  if(!S.meta.since)S.meta.since=0;
  if(!S.days)S.days={};
  for(const r in S.rooms){
    (S.rooms[r].students||[]).forEach(s=>{if(!s.class)s.class='9';if(s.avoid===undefined)s.avoid='';});
    if(!S.rooms[r].rotation)S.rooms[r].rotation=(S.rooms[r].students||[]).map(s=>s.id);
  }
  for(const dt in S.days){
    const day=S.days[dt];if(!day)continue;
    if(day.rooms)for(const r in day.rooms)normRoom(day.rooms[r]);
    if(day.floor)normFloor(day.floor);
  }
  const d=defaultUsers();
  S.users=S.users||d;
  S.users.admin=Object.assign({},d.admin,S.users.admin||{});
  S.users.fc=Object.assign({},d.fc,S.users.fc||{});
  S.users.fcom=Object.assign({},d.fcom,S.users.fcom||{});
  S.users.rc=Object.assign({},d.rc,S.users.rc||{});
  S.settings=S.settings||{};
  S.settings.sheetUrl=GAS_URL;
  S.settings.autoSync=S.settings.autoSync!==false;
  S.settings.rotationStart=S.settings.rotationStart||mondayOf(new Date());
}
function load(){
  try{const raw=localStorage.getItem(LS);
    if(raw){const p=JSON.parse(raw);if(p&&p.rooms){S=p;migrateConfig();pruneLocal();return S;}}
  }catch(e){}
  S=defaultState();return S;
}
/* storage writes are debounced: one write per burst of taps, not one per tap */
let _lsT=null;
function saveLocal(){clearTimeout(_lsT);_lsT=setTimeout(flushLocal,350);}
function flushLocal(){
  clearTimeout(_lsT);_lsT=null;

/* ---------- day / room data ---------- */
function lastRoomDayBefore(date,room){
  const ds=Object.keys(S.days).filter(d=>d<date&&S.days[d]&&S.days[d].rooms&&S.days[d].rooms[room]).sort();
  if(!ds.length)return null;
  return S.days[ds[ds.length-1]].rooms[room];
}
function rotationCaptain(room,date){
  const st=S.rooms[room];
  if(!st||!st.rotation||!st.rotation.length)return '';
  const start=S.settings.rotationStart||mondayOf(new Date());
  const wk=Math.floor(diffDays(start,date)/7);
  const n=st.rotation.length;
  return st.rotation[((wk%n)+n)%n];
}
function newRoomDay(date,room){
  const prev=lastRoomDayBefore(date,room);
  const cleaning=migrateCleaning({});
  if(prev&&prev.cleaning){
    const pc=migrateCleaning(prev.cleaning);
    for(const k of ['harpic','handwash','toothpaste','odonil'])cleaning[k]=!!pc[k];
    /* duty person does NOT carry over blindly – must be chosen each day (forces accountability) */
  }
  return {
    captainId:rotationCaptain(room,date),acting:false,
    salah:{},study:{},food:{},foodNote:{},
    activity:{},notes:{},marks:{},cleaning,discipline:{},
    status:{rcSubmitted:false,rcAt:null,fcConfirmed:false,fcAt:null,fcNote:'',fcomVerified:false,fcomAt:null,fcomNote:''},
    audit:[],_ts:0
  };
}
function newFloorDay(date){
  const prevDates=Object.keys(S.days).filter(d=>d<date&&S.days[d]&&S.days[d].floor).sort();
  const prev=prevDates.length?S.days[prevDates[prevDates.length-1]].floor:null;
  const f=migrateFloorDay({});
  if(prev&&prev.goods)FLOOR_GOODS.forEach(([k])=>f.goods[k]=!!prev.goods[k]);
  Object.assign(f,{fcConfirmed:false,fcAt:null,fcBy:'',fcomVerified:false,fcomAt:null,fcomNote:'',adminNote:'',_ts:0});
  return f;
}
function normFloor(f){migrateFloorDay(f);if(f._ts===undefined)f._ts=0;return f;}
function normRoom(rd){
  ['study','food','foodNote','salah','activity','notes','marks','discipline'].forEach(k=>{if(!rd[k])rd[k]={};});
  if(!rd.audit)rd.audit=[];
  if(!rd.status)rd.status={rcSubmitted:false,rcAt:null,fcConfirmed:false,fcAt:null,fcNote:'',fcomVerified:false,fcomAt:null,fcomNote:''};
  migrateCleaning(rd.cleaning||(rd.cleaning={}));
  for(const sid in rd.food){if(typeof rd.food[sid]==='string'){const o=rd.food[sid];rd.food[sid]={breakfast:o||'eaten',lunch:o||'eaten',dinner:o||'eaten'};}}
  for(const sid in rd.foodNote){if(typeof rd.foodNote[sid]==='string'){rd.foodNote[sid]={breakfast:rd.foodNote[sid],lunch:'',dinner:''};}}
  for(const sid in rd.study){if(typeof rd.study[sid]==='string'){const o=rd.study[sid];rd.study[sid]={};if(o)rd.study[sid].quran=o;}}
  if(rd._ts===undefined)rd._ts=0;
  return rd;
}
function getDay(date){
  if(!S.days[date])S.days[date]={rooms:{},floor:null};
  const d=S.days[date];
  if(!d.rooms)d.rooms={};
  if(!d.floor){d.floor=normFloor(newFloorDay(date));unitSig[date+'|floor']=sig(d.floor);}
  normFloor(d.floor);
  return d;
}
function getRoomDay(date,room){
  const day=getDay(date);
  if(!day.rooms[room]){day.rooms[room]=normRoom(newRoomDay(date,room));unitSig[date+'|'+room]=sig(day.rooms[room]);}
  return normRoom(day.rooms[room]);
}
function rdSafe(date,room){return S.days[date]&&S.days[date].rooms?S.days[date].rooms[room]:null;}

/* ---------- marks / equity ---------- */
function equityFor(date,room,sid){
  const rd=rdSafe(date,room);
  const m=(rd&&rd.marks&&rd.marks[sid])||{};
  const roles=[];
  if(rd&&rd.captainId===sid)roles.push('RC');
  if(S.users.fc.studentId===sid)roles.push('FC');
  if(S.users.fcom.studentId===sid)roles.push('FCom');
  const base=10;
  const raw=base+10*roles.length;
  const roleEquity=Math.min(10,raw);
  const neg=Number(m.neg)||0;
  const bonus=Number(m.bonus)||0;
  return {base,roles,raw,roleEquity,neg,bonus,final:roleEquity+bonus-neg,negReason:m.negReason||'',bonusReason:m.bonusReason||''};
}

function roomProblems(room,date){

  ['washroom','room'].forEach(k=>{
    const c=rd.cleaning[k];

/* last-N-days cleaning record for a task: array of 'ok'|'bad'|'na' */
function cleanStreak(kind,room,n){
  n=n||7;const out=[];
  for(let i=n-1;i>=0;i--){
    const dt=addDays(todayStr(),-i);let c=null;
    if(kind==='floor'){const f=S.days[dt]&&S.days[dt].floor;c=f&&f.floorCleaning;}
    else{const rd=rdSafe(dt,room);c=rd&&rd.cleaning&&rd.cleaning[kind];}

function dutyCounts(){

  for(const dt in S.days){

    const day=S.days[dt];

/* =========================================================
   SYNC v10 — small per-room saves, delta pulls, hard timeouts,
   retry/backoff, merge-on-conflict, confirmed saves.
   Unit key = "YYYY-MM-DD|301" (a room) or "YYYY-MM-DD|floor"
   ========================================================= */
const dirty=new Map();            /* unit key -> version (edits not yet on the server) */
const unitSig={};                 /* unit key -> signature of last synced state */
let _v=1,_pulledOnce=false;
try{JSON.parse(lsGet(LS_QUEUE,'[]')).forEach(k=>{
  if(k.indexOf('|')>0)dirty.set(k,_v++);
  else ROOMS.concat(['floor']).forEach(u=>dirty.set(k+'|'+u,_v++));   /* old queue format */
});}catch(e){}
function saveDirty(){lsSet(LS_QUEUE,JSON.stringify([...dirty.keys()]));}
function sig(o){const c=Object.assign({},o);delete c._ts;return JSON.stringify(c);}
function unitObj(k){const a=k.split('|'),day=S.days[a[0]];if(!day)return null;return a[1]==='floor'?day.floor:(day.rooms&&day.rooms[a[1]]);}
function bump(k){dirty.set(k,_v++);saveDirty();}
function markDirty(date){const day=S.days[date];if(!day)return;ROOMS.forEach(r=>{if(day.rooms&&day.rooms[r])bump(date+'|'+r);});if(day.floor)bump(date+'|floor');}
function baselineAll(){for(const d in S.days){const day=S.days[d];if(!day)continue;ROOMS.forEach(r=>{if(day.rooms&&day.rooms[r])unitSig[d+'|'+r]=sig(day.rooms[r]);});if(day.floor)unitSig[d+'|floor']=sig(day.floor);}}
function whoAmI(){return session?session.role+(session.room?' '+session.room:''):'anon';}

/* ---- network: hard timeout that ALWAYS fires (a hung request can never freeze sync) ---- */
async function gas(method,payload,timeout){
  timeout=timeout||SYNC_TIMEOUT;
  const ctl=new AbortController();let tm;
  const guard=new Promise((_,rej)=>{tm=setTimeout(()=>{try{ctl.abort();}catch(e){}rej(Object.assign(new Error('timeout'),{name:'AbortError'}));},timeout);});
  try{
    const req=(method==='GET'
      ?fetch(GAS_URL+'?'+new URLSearchParams(Object.assign({},payload,{_:Date.now()})),{signal:ctl.signal})
      :fetch(GAS_URL,{method:'POST',signal:ctl.signal,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
    ).then(r=>r.text());
    const txt=await Promise.race([req,guard]);
    try{return JSON.parse(txt);}catch(e){throw new Error('Server did not return JSON — deploy the web app with access "Anyone"');}
  }finally{clearTimeout(tm);}
}
async function postGAS(payload){
  try{return await gas('POST',payload);}
  catch(e){
    if(e&&(e.name==='AbortError'||/JSON/.test(e.message)))throw e;
    /* browser refused to let us read the reply (CORS/redirect quirk): resend once, fire-and-forget (saves are idempotent) */
    await fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    return {ok:true,unconfirmed:true};
  }
}

/* ---- change detection: only rooms that really changed are stamped and sent ---- */
function save(){
  const date=currentDate,day=S.days[date];
  if(day){

    ROOMS.concat(['floor']).forEach(u=>{
      const o=u==='floor'?day.floor:(day.rooms&&day.rooms[u]);if(!o)return;
      const k=date+'|'+u,g=sig(o);
      if(g!==unitSig[k]){o._ts=t;unitSig[k]=g;bump(k);}
    });
  }
  saveLocal();scheduleAutoSync();
}

/* ---- push ---- */
async function pushDirty(){
  if(_pushBusy)return;
  if(!dirty.size){if(!_cfgDirty&&!_cfgBusy)setSync('ok');return;}
  if(!navigator.onLine){setSync('bad');return;}
  _pushBusy=true;setSync('syncing');
  try{
    /* if our picture of the server is stale, pull first and MERGE — never blindly overwrite */
    if(Date.now()-_lastPullOk>45000){
      const ds=[...dirty.keys()].map(k=>k.split('|')[0]).sort();
      const ok=await pullNow({from:ds[0],to:ds[ds.length-1],full:true,silent:true});
      if(!ok)throw new Error('could not refresh before saving');
    }
    while(dirty.size){
      const sent=[],units=[];
      [...dirty.keys()].slice(0,10).forEach(k=>{
        const o=unitObj(k);if(!o){dirty.delete(k);return;}
        const a=k.split('|');sent.push([k,dirty.get(k)]);units.push({date:a[0],unit:a[1],data:o});
      });
      if(!units.length)break;
      const res=await postGAS({action:'save',by:whoAmI(),units});
      if(!res||res.ok===false)throw new Error((res&&res.error)||'server error');
      sent.forEach(([k,v])=>{if(dirty.get(k)===v)dirty.delete(k);});   /* keep it if edited again mid-flight */
      saveDirty();
    }
    saveDirty();S.meta.lastSync=nowStamp();saveLocal();
    _retryMs=0;_pushBusy=false;_pushFails=0;
    if(dirty.size){pushDirty();return;}
    setSync(_cfgDirty?'pending':'ok');
    flashSaved_();
  }catch(err){
    console.warn('Push failed',err);
    _pushBusy=false;saveDirty();setSync(navigator.onLine?'pending':'bad');
    _pushFails=(_pushFails||0)+1;
    if(_pushFails===1||_pushFails%5===0)toast('⚠ Not saved yet — will keep retrying ('+dirty.size+' pending)','bad');
    _retryMs=Math.min(30000,(_retryMs||1500)*2);
    clearTimeout(_pushTimer);_pushTimer=setTimeout(pushDirty,_retryMs);
  }
}
function pushRange(from,to){
  let d=from,g=0;while(d<=to&&g++<400){markDirty(d);d=addDays(d,1);}
  toast('Pushing '+dirty.size+' record(s)…','ok');pushDirty();
}
/* last-gasp save when the tab closes (sendBeacon / keepalive cap is 64 KB, so send per room) */
function flushBeacon(){
  try{flushLocal();}catch(e){}
  if(!S||!S.settings.autoSync||!dirty.size)return;
  for(const k of dirty.keys()){
    const o=unitObj(k);if(!o)continue;const a=k.split('|');
    const body=JSON.stringify({action:'save',by:whoAmI(),units:[{date:a[0],unit:a[1],data:o}]});
    if(body.length>60000)continue;      /* too big for a beacon — stays queued for next visit */
    try{
      if(!(navigator.sendBeacon&&navigator.sendBeacon(GAS_URL,new Blob([body],{type:'text/plain;charset=utf-8'}))))
        fetch(GAS_URL,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain;charset=utf-8'},body});
    }catch(e){}
  }
}

/* ---- merge (server copy in, local edits kept) ---- */
function normUnit(unit,o){return unit==='floor'?normFloor(o):normRoom(o);}
function unionMerge(srv,loc,date,unit){
  const isF=unit==='floor';
  const out=JSON.parse(JSON.stringify(srv));
  const def=isF?newFloorDay(date):newRoomDay(date,unit);      /* what an untouched unit looks like */
  const locNewer=(loc._ts||0)>(srv._ts||0);
  const MAPS=isF?['goods','checks']:['salah','study','food','foodNote','activity','notes','marks','discipline'];
  const overlay=(t,s,d)=>{for(const k in s){const v=s[k],dv=d&&d[k];
    if(v&&typeof v==='object'&&!Array.isArray(v)){if(!t[k]||typeof t[k]!=='object')t[k]={};overlay(t[k],v,dv&&typeof dv==='object'?dv:null);}
    else if(!d||dv!==v)t[k]=v;}};
  for(const k in loc){
    if(k==='_ts'||k==='audit')continue;
    if(MAPS.includes(k)){out[k]=out[k]||{};overlay(out[k],loc[k]||{},def[k]||{});}
    else if(locNewer&&JSON.stringify(loc[k])!==JSON.stringify(def[k]))out[k]=JSON.parse(JSON.stringify(loc[k]));
  }
  const key=a=>a.t+'|'+a.by+'|'+a.msg,seen=new Set((out.audit||[]).map(key));
  out.audit=(out.audit||[]).concat((loc.audit||[]).filter(a=>!seen.has(key(a)))).slice(-200);
  out._ts=Date.now();
  return out;
}
function mergeIn(date,srv){
  if(!S.days[date])S.days[date]={rooms:{},floor:null};
  const day=S.days[date];if(!day.rooms)day.rooms={};
  let changed=false;
  const apply=(unit,s)=>{
    if(!s||typeof s!=='object')return;
    const k=date+'|'+unit,isF=unit==='floor',l=isF?day.floor:day.rooms[unit];
    normUnit(unit,s);
    const put=o=>{if(isF)day.floor=o;else day.rooms[unit]=o;unitSig[k]=sig(o);changed=true;};
    if(!l){put(s);return;}
    if(dirty.has(k)){                                   /* we have unsent edits */
      if((s._ts||0)===(l._ts||0))return;                /* same version — nothing to merge */
      const m=unionMerge(s,l,date,unit);normUnit(unit,m);put(m);bump(k);return;
    }
    if((s._ts||0)>(l._ts||0)&&sig(s)!==sig(l))put(s);
  };
  for(const r in (srv.rooms||{}))apply(r,srv.rooms[r]);
  if(srv.floor)apply('floor',srv.floor);
  return changed;
}
function userIsBusy(){
  const m=document.getElementById('modal');
  if(m&&m.style.display!=='none')return true;
  const a=document.activeElement;
  return !!a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT');
}

/* ---- pull (delta: only rows changed since the last pull) ---- */
function pullNow(o){
  o=o||{};
  if(!o.full&&_pullN>0&&_pullQ)return _pullQ;            /* never stack routine polls */
  _pullN++;
  const run=()=>_pull(o).finally(()=>{_pullN--;});
  const p=_pullQ?_pullQ.then(run):run();
  _pullQ=p;return p;
}
async function _pull(o){
  if(!navigator.onLine||!GAS_URL){_pulledOnce=true;return false;}
  const today=todayStr(),std=!o.full;
  const from=o.from||addDays(today,-6),to=o.to||addDays(today,2);
  if(!o.silent&&!dirty.size)setSync('syncing');
  try{
    const data=await gas('GET',{action:'load',from,to,since:std?(S.meta.since||0):0,cfg:S.meta.cfgTs||0});
    if(!data||data.ok===false)throw new Error((data&&data.error)||'server error');
    let changed=false;
    if(data.config&&!_cfgDirty&&!_cfgBusy){
      const before=JSON.stringify([S.rooms,S.users,S.settings.rotationStart]);
      applyConfig(data.config);
      if(before!==JSON.stringify([S.rooms,S.users,S.settings.rotationStart]))changed=true;
    }
    if(data.days)for(const date in data.days){if(mergeIn(date,data.days[date]))changed=true;}
    if(std&&data.now)S.meta.since=Math.max(0,data.now-500);   /* server writes are lock-ordered, so a tiny overlap is enough */
    S.meta.lastPull=nowStamp();_lastPullOk=Date.now();_pulledOnce=true;
    saveLocal();
    if(!dirty.size&&!_pushBusy&&!_cfgDirty&&!_cfgBusy)setSync('ok');
    /* never redraw the login screen; never redraw while someone is typing */
    if(changed&&session&&(o.render||!userIsBusy()))render();
    return true;
  }catch(err){
    console.warn('Pull failed',err);
    _pulledOnce=true;
    if(!dirty.size&&!_pushBusy)setSync('bad');
    return false;
  }
}
function repPull(){render();pullNow({from:repFrom,to:repTo,full:true,silent:true,render:true});}
function startPolling(){
  clearInterval(_pollT);
  _pollT=setInterval(()=>{
    if(document.hidden||!S.settings.autoSync)return;
    if(dirty.size)pushDirty();else pullNow({silent:true});
  },PULL_MS);
}
window.addEventListener('online',()=>{setSync('pending');pushDirty();if(_cfgDirty)pushConfig();pullNow({silent:true});});
window.addEventListener('offline',()=>setSync('bad'));
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushBeacon();else{pushDirty();pullNow({silent:true});}});
window.addEventListener('pagehide',flushBeacon);
window.addEventListener('focus',()=>{if(S&&S.settings.autoSync)pullNow({silent:true});});

async function initialLoad(){
  render();                      /* login appears instantly from local data */
  startPolling();
  checkServerVersion_();         /* one lightweight ping — tells you if an old deploy is still live */
  await pullNow();               /* then refresh in the background */
  if(dirty.size)pushDirty();
}
async function checkServerVersion_(){
  try{
    const r=await gas('GET',{action:'ping'},8000);
    _serverVOK = !r || !r.v ? null : (r.v===EXPECT_SERVER_V);
    if(_serverVOK===false){
      toast('⚠ Server code is out of date (server '+r.v+', app expects '+EXPECT_SERVER_V+'). Redeploy Code.gs as a NEW VERSION.','bad');
      console.warn('GAS version mismatch: server='+r.v+' expected='+EXPECT_SERVER_V);
    }
  }catch(e){ _serverVOK=null; }
}

}

function setDate(d){

  if(d<addDays(t,-5)||d>addDays(t,2))pullNow({from:addDays(d,-1),to:addDays(d,1),full:true,silent:true,render:true});

  for(const slot of STUDY_TIMES){

      <div class="btn-group">${bg(STUDY_LOC,study[slot.k]||'',!canEdit,`setStudy('${room}','${s.id}','${slot.k}'`)}</div></div>`;
  }

  h+=`<div class="section-head">Food (3 meals) <span class="muted" style="text-transform:none;font-weight:400;letter-spacing:0">· if not eaten, write <b>what they don't eat</b></span></div>`;
  h+=`<div class="entry-row"><div class="entry-label">Usually avoids</div>
    <input class="entry-note" value="${esc(s.avoid||'')}" ${(canEdit||session.role==='rc')?'':'disabled'} onchange="setAvoid('${room}','${s.id}',this.value)" placeholder="Standing food dislikes / allergies (e.g. egg, brinjal, fish)">
  </div>`;
  for(const meal of MEALS){
    const cur=food[meal.k]||'eaten';
    const note=foodNote[meal.k]||'';
    const notEaten=cur==='not_eaten';
    h+=`<div class="entry-row"><div class="entry-label">${meal.l}</div>
      <div class="btn-group">${bg(FOOD_OPTS,cur,!canEdit,`setFood('${room}','${s.id}','${meal.k}'`)}</div>
      <input class="entry-note ${notEaten&&!note.trim()?'need':''}" value="${esc(note)}" ${canEdit?'':'disabled'}
        onchange="setFoodNote('${room}','${s.id}','${meal.k}',this.value)"
        placeholder="${notEaten?'What does he NOT eat? (required — e.g. rice, dal, egg)':'Optional note'}">
    </div>`;
    if(notEaten&&s.avoid&&!note.trim()&&canEdit){
      h+=`<div class="entry-row"><div class="entry-label"></div><div class="btn-group">
        <div class="btn-opt" data-clickable="1" onclick="setFoodNote('${room}','${s.id}','${meal.k}','${esc(s.avoid).replace(/'/g,"\\'")}');render()">↳ use "${esc(s.avoid)}"</div></div></div>`;
    }
  }

  h+=`<div class="section-head">Activity / Whereabouts</div>
    <div class="entry-row"><div class="entry-label">Activity</div>
    <div class="btn-group">${bg(ACTIVITY,rd.activity[s.id]||'',!canEdit,`setActivity('${room}','${s.id}'`)}</div></div>
    <div class="entry-row"><div class="entry-label">Note</div>
    <input class="entry-note" value="${esc(rd.notes[s.id]||'')}" ${canEdit?'':'disabled'} onchange="setNote('${room}','${s.id}',this.value)" placeholder="optional"></div>`;
  return h+`</div></div>`;
}
function bg(options,current,disabled,fnPrefix){
  return options.map(o=>{
    const active=o.v===current;
    const tone=o.tone||'info';
    const onclick=disabled?'':`${fnPrefix},'${o.v}')`;
    return `<div class="btn-opt ${active?'active':''}" data-clickable="${disabled?'':'1'}" data-tone="${active?tone:''}" title="${esc(o.l)}" onclick="${onclick}">${esc(o.short)}</div>`;
  }).join('');
}

/* ---------- captain picker modal ---------- */
function openCaptainPicker(room){
  const st=S.rooms[room];
  const rd=getRoomDay(currentDate,room);
  const current=rd.captainId||'';
  const opts=[`<option value="">— nobody / clear —</option>`]
    .concat(st.students.map(s=>`<option value="${esc(s.id)}" ${s.id===current?'selected':''}>${esc(s.name)} (${s.id}) · Class ${esc(s.class||'—')}</option>`));
  showModal(`
    <h3 style="margin-top:0">Change Room ${room} Captain</h3>
    <div class="muted small" style="margin-bottom:10px">Choose who is on duty as captain for ${esc(prettyDate(currentDate))}.</div>
    <select id="handover_select" style="width:100%;padding:10px;font-size:15px">${opts.join('')}</select>
    <label class="chk" style="margin-top:12px"><input type="checkbox" id="handover_acting" ${rd.acting?'checked':''}> Acting captain (regular captain on vacation)</label>
    <div class="row" style="margin-top:14px;gap:8px">
      <button class="primary" onclick="applyHandover('${room}')">Save</button>
      <button class="ghost" onclick="closeModal()">Cancel</button>
    </div>`);

function showModal(html){
  let m=document.getElementById('modal');
  if(!m){
    m=document.createElement('div');m.id='modal';
    m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px';
    m.onclick=function(e){if(e.target===m)closeModal();};
    document.body.appendChild(m);
  }
  m.innerHTML=`<div class="card" style="max-width:460px;width:100%;margin:0">${html}</div>`;
  m.style.display='flex';
}
function closeModal(){const m=document.getElementById('modal');if(m)m.style.display='none';}
function applyHandover(room){
  const sel=document.getElementById('handover_select');
  const acting=document.getElementById('handover_acting');
  const newId=sel?sel.value:'';
  const rd=getRoomDay(currentDate,room);
  rd.captainId=newId||'';rd.acting=acting?!!acting.checked:false;
  audit(room,'Handover: captain set to '+(newId||'—')+(rd.acting?' (acting)':''));
  save();closeModal();render();
  toast(newId?('Captain set to '+newId):'Captain cleared','ok');
}

function setSalah(room,sid,prayer,val){const rd=getRoomDay(currentDate,room);if(!rd.salah[sid])rd.salah[sid]={};rd.salah[sid][prayer]=val;save();render();}
function setStudy(room,sid,slot,val){const rd=getRoomDay(currentDate,room);if(!rd.study[sid]||typeof rd.study[sid]==='string')rd.study[sid]={};rd.study[sid][slot]=val;save();render();}
function setFood(room,sid,meal,val){
  const rd=getRoomDay(currentDate,room);

function setFoodNote(room,sid,meal,val){const rd=getRoomDay(currentDate,room);if(!rd.foodNote[sid]||typeof rd.foodNote[sid]==='string')rd.foodNote[sid]={breakfast:'',lunch:'',dinner:''};rd.foodNote[sid][meal]=val;save();}
function setAvoid(room,sid,val){const s=S.rooms[room].students.find(x=>x.id===sid);if(s){s.avoid=val.trim();saveConfig();render();}}
function setActivity(room,sid,val){getRoomDay(currentDate,room).activity[sid]=val;save();render();}
function setNote(room,sid,val){getRoomDay(currentDate,room).notes[sid]=val;save();}
/* cleaning */
function setCleanStatusW(room,val){getRoomDay(currentDate,room).cleaning.washroom.status=val;audit(room,'Washroom '+val);save();render();}
function setCleanDutyW(room,val){getRoomDay(currentDate,room).cleaning.washroom.dutyBy=val;audit(room,'Washroom duty → '+studentName(val));save();render();}
function setCleanNoteW(room,val){getRoomDay(currentDate,room).cleaning.washroom.note=val;save();}
function setCleanStatusR(room,val){getRoomDay(currentDate,room).cleaning.room.status=val;audit(room,'Room cleaning '+val);save();render();}
function setCleanDutyR(room,val){getRoomDay(currentDate,room).cleaning.room.dutyBy=val;audit(room,'Room duty → '+studentName(val));save();render();}
function setCleanNoteR(room,val){getRoomDay(currentDate,room).cleaning.room.note=val;save();}
function toggleEquip(room,key){const rd=getRoomDay(currentDate,room);rd.cleaning[key]=!rd.cleaning[key];save();render();}
/* discipline */
function setDisc(room,key,val){const rd=getRoomDay(currentDate,room);if(!rd.discipline[key])rd.discipline[key]={status:'',note:''};rd.discipline[key].status=val;if(val!=='issue')rd.discipline[key].note='';save();render();}
function setDiscNote(room,key,val){const rd=getRoomDay(currentDate,room);if(!rd.discipline[key])rd.discipline[key]={status:'issue',note:''};rd.discipline[key].note=val;save();}
function discAllOk(room){
  const rd=getRoomDay(currentDate,room);
  DISCIPLINE.forEach(x=>{if(!rd.discipline[x.k]||!rd.discipline[x.k].status)rd.discipline[x.k]={status:'ok',note:''};});
  audit(room,'Discipline: remaining marked OK');save();render();toast('Remaining items marked OK','ok');
}
function adjMark(room,sid,kind){
  const rd=getRoomDay(currentDate,room);
  if(!rd.marks[sid])rd.marks[sid]={neg:0,negReason:'',bonus:0,bonusReason:''};
  const cur=kind==='neg'?rd.marks[sid].neg:rd.marks[sid].bonus;
  const v=prompt(kind==='neg'?'Negative points:':'Bonus points:',cur||0);
  if(v===null)return;
  const n=Math.max(0,Number(v)||0);
  const r=prompt('Reason:')||'';
  if(kind==='neg'){rd.marks[sid].neg=n;rd.marks[sid].negReason=r;}
  else{rd.marks[sid].bonus=n;rd.marks[sid].bonusReason=r;}
  audit(room,`${kind} ${n} for ${sid} — ${r}`);save();render();toast('Mark updated','ok');
}
function quickBonus(room,sid){
  const rd=getRoomDay(currentDate,room);
  if(!rd.marks[sid])rd.marks[sid]={neg:0,negReason:'',bonus:0,bonusReason:''};
  rd.marks[sid].bonus=(Number(rd.marks[sid].bonus)||0)+1;
  rd.marks[sid].bonusReason=(rd.marks[sid].bonusReason?rd.marks[sid].bonusReason+'; ':'')+'Helped floor incharge';
  audit(room,`+1 help point for ${sid}`);save();render();toast('+1 help point added','ok');
}
function submitRoom(room){
  if(!canEditRoom(room))return toast('Editing window closed','bad');
  const probs=roomProblems(room);
  if(probs.length&&!confirm('These items are still incomplete:\n\n• '+probs.slice(0,10).join('\n• ')+(probs.length>10?'\n…and '+(probs.length-10)+' more':'')+'\n\nSubmit anyway?'))return;
  const rd=getRoomDay(currentDate,room);
  rd.status.rcSubmitted=true;rd.status.rcAt=nowStamp();
  rd.status.fcConfirmed=false;rd.status.fcomVerified=false;
  audit(room,'Room Captain submitted'+(probs.length?' ('+probs.length+' pending items)':''));
  save();render();toast(probs.length?'Submitted with '+probs.length+' pending item(s)':'Submitted to Floor Captain','ok');
}
function saveOpinion(room,which){
  const rd=getRoomDay(currentDate,room);
  if(which==='fc'){rd.status.fcNote=(document.getElementById('opine_'+room)||{}).value||'';audit(room,'FC opinion recorded');}
  else{rd.status.fcomNote=(document.getElementById('fcomnote_'+room)||{}).value||'';audit(room,'FCom note recorded');}
  save();render();toast('Saved','ok');
}
function fcConfirmRoom(room){const rd=getRoomDay(currentDate,room);if(!rd.status.rcSubmitted)return toast('Not submitted yet','bad');rd.status.fcConfirmed=true;rd.status.fcAt=nowStamp();audit(room,'FC confirmed');save();render();toast('Confirmed','ok');}
function fcomVerifyRoom(room){const rd=getRoomDay(currentDate,room);if(!rd.status.fcConfirmed)return toast('FC not confirmed yet','bad');rd.status.fcomVerified=true;rd.status.fcomAt=nowStamp();audit(room,'FCom verified');save();render();toast('Verified','ok');}
function fcConfirmFloor(){

  if(fp.length&&!confirm('Floor duty incomplete:\n\n• '+fp.join('\n• ')+'\n\nConfirm anyway?'))return;
  const fd=getDay(currentDate).floor;fd.fcConfirmed=true;fd.fcAt=nowStamp();fd.fcBy=session.role;

}
function fcomVerifyFloor(){const fd=getDay(currentDate).floor;if(!fd.fcConfirmed)return toast('FC not confirmed yet','bad');fd.fcomVerified=true;fd.fcomAt=nowStamp();fd.fcomNote=(document.getElementById('fcomFloorNote')||{}).value||fd.fcomNote||'';save();render();toast('Full day verified','ok');}
/* floor duty */
function setGoodsNote(val){getDay(currentDate).floor.goodsNote=val;save();}
function saveGoodsBy(val){getDay(currentDate).floor.goodsBy=val;save();}
function toggleGoods(key){const fd=getDay(currentDate).floor;fd.goods[key]=!fd.goods[key];save();render();}
function setFloorCleanStatus(val){getDay(currentDate).floor.floorCleaning.status=val;save();render();}

function setFloorCheck(key,val){const fd=getDay(currentDate).floor;if(!fd.checks[key])fd.checks[key]={status:'',note:''};fd.checks[key].status=val;if(val!=='issue')fd.checks[key].note='';save();render();}
function setFloorCheckNote(key,val){const fd=getDay(currentDate).floor;if(!fd.checks[key])fd.checks[key]={status:'issue',note:''};fd.checks[key].note=val;save();}

function confirmView(){
  const fd=getDay(currentDate).floor;

  let h=`<h2>Confirmation &amp; Verification · ${prettyDate(currentDate)}</h2>`;

  for(const room of ROOMS){
    const rd=getRoomDay(currentDate,room);
    const capObj=S.rooms[room].students.find(x=>x.id===rd.captainId);
    const cap=capObj?capObj.name:(rd.captainId||'—');
    const tot=S.rooms[room].students.reduce((a,s)=>a+equityFor(currentDate,room,s.id).final,0);
    const pr=roomProblems(room).length;
    h+=`<tr>
      <td><b>${room}</b></td><td>${esc(cap)}</td><td>${classPill(capObj?capObj.class:'')||'—'}</td>

      <td>${rd.status.fcConfirmed?`<span class="chip ok">${esc(rd.status.fcAt||'')}</span>`:'<span class="chip">—</span>'}</td>
      <td>${rd.status.fcomVerified?`<span class="chip ok">${esc(rd.status.fcomAt||'')}</span>`:'<span class="chip">—</span>'}</td>
      <td>${pr?`<span class="chip warn">${pr}</span>`:'<span class="chip ok">0</span>'}</td>
      <td>${tot}</td>
      <td class="row">
        ${(session.role==='fc'||session.role==='admin')&&!rd.status.fcConfirmed?`<button class="ok" onclick="fcConfirmRoom('${room}')">Confirm</button>`:''}

        <button class="ghost" onclick="editRoom('${room}')">Open</button>
      </td></tr>`;
  }
  h+=`</tbody></table></div>`;
  const fp=floorProblems();
  h+=`<div class="card"><h3>Floor-level full-day sign-off</h3>
    <div class="row">
      <span class="chip ${allSub?'ok':'bad'}">${allSub?'All 3 rooms submitted':'Awaiting rooms'}</span>
      <span class="chip ${fd.fcConfirmed?'ok':''}">FC confirmed ${fd.fcConfirmed?'· '+esc(fd.fcAt||''):''}</span>
      <span class="chip ${fd.fcomVerified?'ok':''}">FCom verified ${fd.fcomVerified?'· '+esc(fd.fcomAt||''):''}</span>
      <span class="chip ${fp.length?'warn':'ok'}">Floor duty: ${fp.length?fp.length+' pending':'complete'}</span>
    </div>
    ${fp.length?`<div class="warnnote" style="margin-top:10px">${fp.map(esc).join('<br>')}</div>`:''}`;
  if(session.role==='fc'||session.role==='admin'){
    h+=`<hr>
      <label class="chk"><input type="checkbox" ${allSub?'checked':''} disabled> All three rooms have submitted</label>
      ${!allSub?`<div class="warnnote">Cannot confirm — ${ROOMS.filter(r=>{const rd=rdSafe(currentDate,r);return !rd||!rd.status.rcSubmitted;}).map(r=>'Room '+r).join(', ')} pending.</div>`:''}
      <button class="ok" ${allSub?'':'disabled'} onclick="fcConfirmFloor()">Confirm full day data</button>`;
  }
  if(session.role==='fcom'||session.role==='admin'){
    h+=`<hr>
      <textarea id="fcomFloorNote" rows="2" style="width:100%" placeholder="Verification note…">${esc(fd.fcomNote||'')}</textarea>

/* =========================================================
   FLOOR DUTY  (Floor Captain: floor cleaning + checks + goods)

  for(const r of ROOMS)S.rooms[r].students.forEach(s=>all.push({id:s.id,name:s.name+' · Room '+r}));

  h+=`<div class="card"><h3>🧹 Floor cleaning</h3>

        <span class="row small muted" style="gap:6px">7 days ${streakHTML(cleanStreak('floor'))}</span></div>
      <div class="entry-row"><div class="entry-label">Duty person *</div>
        <select class="duty-select ${!c.dutyBy?'need':''}" ${editable?'':'disabled'} onchange="setFloorCleanDuty(this.value)">

        </select></div>
      <div class="entry-row"><div class="entry-label">Status *</div>
        <div class="btn-group">${bg(CLEAN_STATUS,c.status||'',!editable,`setFloorStatusWrap(''`)}</div></div>
      ${c.status==='not_done'?`<div class="entry-row"><div class="entry-label">Why not?</div>
        <input class="entry-note ${!(c.note||'').trim()?'need':''}" value="${esc(c.note||'')}" ${editable?'':'disabled'} onchange="setFloorCleanNote(this.value)" placeholder="Reason it was not done (required)"></div>`:''}
      ${!c.dutyBy&&c.status?`<div class="badnote" style="margin:6px 0 0">Duty person must be recorded — even when the task is done.</div>`:''}
    </div></div>`;

  h+=`<div class="card"><h3>📋 Floor inspection <span class="muted small">· ${FLOOR_CHECKS.filter(x=>fd.checks[x.k]&&fd.checks[x.k].status).length}/${FLOOR_CHECKS.length} checked</span></h3>`;

      <div class="btn-group" style="flex:0 0 auto">${bg(CHECK_STATUS,cur.status||'',!editable,`setFloorCheck('${x.k}'`)}</div>
      ${cur.status==='issue'?`<input class="entry-note ${!(cur.note||'').trim()?'need':''}" value="${esc(cur.note||'')}" ${editable?'':'disabled'} onchange="setFloorCheckNote('${x.k}',this.value)" placeholder="What is the issue? (required)">`:''}
    </div>`;
  });
  if(editable)h+=`<div class="row" style="margin-top:10px"><button class="ghost" onclick="floorAllOk()">✓ Mark all remaining as OK</button></div>`;
  h+=`</div>`;

  h+=`<div class="card"><h3>📦 Availability of goods on the floor</h3>
    <div class="btn-group" style="margin-top:10px">
      ${FLOOR_GOODS.map(([k,l])=>{const on=fd.goods[k];
        return `<div class="btn-opt ${on?'active':''}" data-clickable="${editable?'1':''}" data-tone="${on?'ok':''}" onclick="${editable?`toggleGoods('${k}')`:''}">${l}</div>`;}).join('')}
    </div>
    <div class="row" style="margin-top:14px"><span class="small muted">Checked by:</span>

    <div style="margin-top:12px"><textarea rows="2" style="width:100%" ${editable?'':'disabled'} placeholder="Notes…" onchange="setGoodsNote(this.value)">${esc(fd.goodsNote||'')}</textarea></div>
  </div>`;
  return h;
}
/* bg() appends ,'value') — floor status has no leading args, so wrap */
function setFloorStatusWrap(_,v){setFloorCleanStatus(v);}

/* =========================================================
   ROSTER
   ========================================================= */
function rosterView(){
  const rooms=session.role==='rc'?[session.room]:ROOMS;
  const canEdit=session.role==='admin'||session.role==='fcom'||session.role==='rc';
  let h=`<h2>Roster <span class="muted small">· names, classes &amp; food dislikes</span></h2>`;
  for(const room of rooms){
    const st=S.rooms[room];
    const counts={};
    st.students.forEach(s=>{counts[s.class]=(counts[s.class]||0)+1;});
    h+=`<div class="card"><h3>Room ${room} · ${st.students.length} students · ${st.rotation.length} in rotation</h3>
      <div class="row small muted" style="margin-bottom:8px">
        ${CLASSES.filter(c=>counts[c]).map(c=>`<span class="chip">Class ${c}: ${counts[c]}</span>`).join('')||'<span class="chip">No students</span>'}
      </div>
      <div class="scrollx"><table class="tbl">
        <thead><tr><th>#</th><th>ID</th><th>Name</th><th>Class</th><th>Doesn't eat</th><th>In rotation</th><th></th></tr></thead><tbody>
        ${st.students.map((s,i)=>`<tr>
          <td>${i+1}</td><td class="mono">${esc(s.id)}</td>
          <td><input value="${esc(s.name)}" ${canEdit?'':'disabled'} onchange="renameStudent('${room}','${s.id}',this.value)"></td>
          <td>${canEdit?`<select onchange="setStudentClass('${room}','${s.id}',this.value)">${CLASSES.map(c=>`<option value="${c}" ${s.class===c?'selected':''}>${c}</option>`).join('')}</select>`:classPill(s.class)}</td>
          <td><input value="${esc(s.avoid||'')}" ${canEdit?'':'disabled'} onchange="setAvoid('${room}','${s.id}',this.value)" placeholder="e.g. egg, fish"></td>
          <td>${st.rotation.includes(s.id)?'✔':'—'}</td>
          <td>
            <button class="ghost" ${canEdit?'':'disabled'} onclick="toggleRotation('${room}','${s.id}')">${st.rotation.includes(s.id)?'Remove from rotation':'Add to rotation'}</button>
            <button class="bad" ${canEdit?'':'disabled'} onclick="removeStudent('${room}','${s.id}')">Remove</button>
          </td></tr>`).join('')}
      </tbody></table></div>
      <div class="row" style="margin-top:12px">
        <input id="newId_${room}" placeholder="Student ID (e.g. ${room}-07)" style="width:180px">
        <input id="newName_${room}" placeholder="Full name" style="width:200px">
        <select id="newClass_${room}">${CLASSES.map(c=>`<option value="${c}">Class ${c}</option>`).join('')}</select>
        <button class="primary" ${canEdit?'':'disabled'} onclick="addStudent('${room}')">Add student</button>
      </div>
    </div>`;
  }
  return h;
}
function addStudent(room){
  const id=((document.getElementById('newId_'+room)||{}).value||'').trim();
  const name=((document.getElementById('newName_'+room)||{}).value||'').trim();
  const cls=((document.getElementById('newClass_'+room)||{}).value||'9');
  if(!id)return toast('Enter a student ID','bad');
  const st=S.rooms[room];
  if(st.students.some(s=>s.id===id))return toast('That ID already exists','bad');
  st.students.push({id,name:name||('Student '+id),class:cls,avoid:''});
  if(!st.rotation.includes(id))st.rotation.push(id);
  saveConfig();render();toast('Student added','ok');
}
function removeStudent(room,id){
  if(!confirm('Remove '+id+' from Room '+room+'?'))return;
  const st=S.rooms[room];
  st.students=st.students.filter(s=>s.id!==id);
  st.rotation=st.rotation.filter(x=>x!==id);
  saveConfig();render();toast('Student removed','ok');
}
function renameStudent(room,id,val){const s=S.rooms[room].students.find(x=>x.id===id);if(s){s.name=val;saveConfig();}}
function setStudentClass(room,id,val){const s=S.rooms[room].students.find(x=>x.id===id);if(s){s.class=val;saveConfig();toast('Class updated','ok');}}
function toggleRotation(room,id){
  const st=S.rooms[room];
  if(st.rotation.includes(id))st.rotation=st.rotation.filter(x=>x!==id);else st.rotation.push(id);
  saveConfig();render();
}

/* =========================================================
   REPORTS  (marks + duty accountability)
   ========================================================= */
function reportsView(){
  const roomList=session.role==='rc'?[session.room]:ROOMS;
  let h=`<h2>Reports</h2>
    <div class="card"><div class="row">
      <span class="small muted">From</span><input type="date" value="${repFrom}" onchange="repFrom=this.value;repPull()">
      <span class="small muted">To</span><input type="date" value="${repTo}" onchange="repTo=this.value;repPull()">
      <div class="spacer"></div>
      <button class="ghost" onclick="pushRange(repFrom,repTo)">Push range to Sheet</button>
    </div></div>`;
  const dates=[];let d=repFrom,guard=0;
  while(d<=repTo&&guard++<400){dates.push(d);d=addDays(d,1);}
  for(const room of roomList){
    const st=S.rooms[room];
    h+=`<div class="card scrollx"><h3>Room ${room} · Marks</h3>
      <table class="tbl"><thead><tr><th>ID</th><th>Class</th><th>Name</th><th>Days</th><th>Capt. days</th><th>Bonus</th><th>Neg</th><th>Total</th><th>Avg</th></tr></thead><tbody>`;
    for(const s of st.students){
      let days=0,cap=0,bonus=0,neg=0,total=0;
      for(const dt of dates){
        const rd=rdSafe(dt,room);if(!rd)continue;
        const has=(rd.salah&&Object.keys(rd.salah[s.id]||{}).length)||(rd.activity&&rd.activity[s.id])||(rd.study&&rd.study[s.id]);
        if(!has&&!(rd.marks&&rd.marks[s.id]))continue;
        const e=equityFor(dt,room,s.id);
        days++;if(e.roles.includes('RC'))cap++;
        bonus+=e.bonus;neg+=e.neg;total+=e.final;
      }
      h+=`<tr><td class="mono">${esc(s.id)}</td><td>${classPill(s.class)||'—'}</td><td>${esc(s.name)}</td><td>${days}</td><td>${cap}</td>
        <td style="color:var(--ok)">+${bonus}</td><td style="color:var(--bad)">−${neg}</td>
        <td><b>${total}</b></td><td>${days?(total/days).toFixed(2):'—'}</td></tr>`;
    }
    h+=`</tbody></table></div>`;
  }
  /* duty accountability */
  const cnt={};
  for(const dt of dates){
    const day=S.days[dt];if(!day)continue;
    for(const r of roomList){
      const c=day.rooms&&day.rooms[r]&&day.rooms[r].cleaning;if(!c)continue;
      [['washroom','Washroom'],['room','Room']].forEach(([k,lbl])=>{
        const x=c[k];if(!x||!x.dutyBy)return;
        const o=cnt[x.dutyBy]||(cnt[x.dutyBy]={total:0,done:0,notdone:0,tasks:{}});
        o.total++;if(x.status==='done')o.done++;if(x.status==='not_done')o.notdone++;
        o.tasks[lbl]=(o.tasks[lbl]||0)+1;
      });
    }
    if(session.role!=='rc'){
      const f=day.floor&&day.floor.floorCleaning;
      if(f&&f.dutyBy){const o=cnt[f.dutyBy]||(cnt[f.dutyBy]={total:0,done:0,notdone:0,tasks:{}});o.total++;if(f.status==='done')o.done++;if(f.status==='not_done')o.notdone++;o.tasks.Floor=(o.tasks.Floor||0)+1;}
    }
  }
  const rows=Object.keys(cnt).sort((a,b)=>cnt[b].notdone-cnt[a].notdone||cnt[b].total-cnt[a].total);
  h+=`<div class="card scrollx"><h3>🧹 Duty accountability <span class="muted small">· who was on duty, and did they complete it</span></h3>
    <table class="tbl"><thead><tr><th>Student</th><th>Duties</th><th>Done</th><th>Not done</th><th>Not confirmed</th><th>Tasks</th></tr></thead><tbody>
    ${rows.length?rows.map(id=>{const o=cnt[id];return `<tr>
      <td><b>${esc(studentName(id))}</b> <span class="muted mono small">${esc(id)}</span></td>
      <td>${o.total}</td><td style="color:var(--ok)">${o.done}</td>
      <td style="color:${o.notdone?'var(--bad)':'inherit'}"><b>${o.notdone}</b></td>
      <td>${o.total-o.done-o.notdone}</td>
      <td class="small muted">${Object.entries(o.tasks).map(([k,v])=>k+' ×'+v).join(', ')}</td></tr>`;}).join(''):'<tr><td colspan="6" class="muted">No duty records in this range.</td></tr>'}
    </tbody></table></div>`;
  return h;
}

/* =========================================================
   ADMIN
   ========================================================= */
function adminView(){
  const allStudents=[];
  for(const r of ROOMS)S.rooms[r].students.forEach(s=>allStudents.push({room:r,id:s.id,name:s.name,cls:s.class}));
  const optList=[{v:'',l:'— none —'}].concat(allStudents.map(s=>({v:s.id,l:s.name+' ('+s.room+') · Cl.'+(s.cls||'—')})));
  let h=`<h2>Administration</h2>`;
  h+=`<div class="card"><h3>Roles &amp; passcodes <span class="muted small">· default 1122 · saves to sheet automatically</span></h3>
    <div class="grid2">
      <div>
        <label class="chk">Floor Captain — student ID</label>
        <select onchange="setStaff('fc','studentId',this.value)">${optList.map(o=>`<option value="${o.v}" ${o.v===S.users.fc.studentId?'selected':''}>${esc(o.l)}</option>`).join('')}</select>
        <div style="margin-top:10px"><label class="chk">Floor Captain passcode</label>
        <input value="${esc(S.users.fc.pin)}" onchange="setStaff('fc','pin',this.value)"></div>
      </div>
      <div>
        <label class="chk">Floor Commander — student ID</label>
        <select onchange="setStaff('fcom','studentId',this.value)">${optList.map(o=>`<option value="${o.v}" ${o.v===S.users.fcom.studentId?'selected':''}>${esc(o.l)}</option>`).join('')}</select>
        <div style="margin-top:10px"><label class="chk">Floor Commander passcode</label>
        <input value="${esc(S.users.fcom.pin)}" onchange="setStaff('fcom','pin',this.value)"></div>
      </div>
    </div><hr>
    <div class="grid3">
      ${ROOMS.map(r=>`<div><label class="chk">Room ${r} passcode</label>
        <input value="${esc(S.users.rc[r])}" onchange="setRcPin('${r}',this.value)"></div>`).join('')}
      <div><label class="chk">Floor Incharge passcode</label>
        <input value="${esc(S.users.admin.pin)}" onchange="setStaff('admin','pin',this.value)"></div>
    </div>
    <div class="row" style="margin-top:10px"><button class="ghost" onclick="resetAllPins()">Reset all passcodes to 1122</button></div>
  </div>`;
  h+=`<div class="card"><h3>Weekly captaincy rotation</h3>
    <div class="row"><span class="small muted">Rotation start (Monday)</span>
      <input type="date" value="${S.settings.rotationStart}" onchange="S.settings.rotationStart=this.value;saveConfig();render()"></div>
    <hr><div class="grid3">
      ${ROOMS.map(r=>{
        const cap=rotationCaptain(r,todayStr());
        const s=S.rooms[r].students.find(x=>x.id===cap);
        return `<div class="stat"><div><b>${esc(cap||'—')}</b>this week · Room ${r} · Class ${esc(s?s.class:'—')}</div></div>`;
      }).join('')}
    </div>
  </div>`;
  h+=`<div class="card"><h3>Google Sheet sync</h3>
    <div class="row"><input style="flex:1;min-width:280px" value="${esc(GAS_URL)}" readonly>
      <button class="ghost" onclick="pingGAS()">Ping</button></div>
    <label class="chk"><input type="checkbox" ${S.settings.autoSync?'checked':''} onchange="S.settings.autoSync=this.checked;if(!this.checked)cancelSyncTimers();saveConfig()"> Auto-sync (push after every edit · pull every ${PULL_MS/1000}s)</label>
    <div class="row" style="margin-top:10px">
      <button class="primary" onclick="pushRange(addDays(todayStr(),-14),todayStr())">Push last 14 days now</button>
      <button class="ghost" onclick="pushConfig()">Push roster &amp; passcodes now</button>
      <button class="ghost" onclick="pullNow({from:addDays(todayStr(),-60),to:addDays(todayStr(),2),full:true,render:true});toast('Pulling…')">Pull from sheet now</button>
    </div>
    <div class="muted small" style="margin-top:10px">
      Last push: ${esc(S.meta.lastSync||'never')} · Last config push: ${esc(S.meta.lastConfigSync||'never')} · Last pull: ${esc(S.meta.lastPull||'never')} · Unsynced dates: ${dirty.size}
    </div>
  </div>`;
  h+=`<div class="card"><h3>Backup &amp; restore</h3>
    <div class="row">
      <button class="ghost" onclick="exportJSON()">Download JSON backup</button>
      <input type="file" id="importFile" accept=".json" onchange="importJSON(this)">
      <div class="spacer"></div>
      <button class="bad" onclick="wipeAll()">Erase all data</button>
    </div>
  </div>`;
  return h;
}
function setStaff(which,key,val){S.users[which][key]=val;saveConfig();render();toast('Saved','ok');}
function setRcPin(room,val){S.users.rc[room]=val;saveConfig();toast('Saved','ok');}
function resetAllPins(){
  if(!confirm('Reset every passcode to 1122?'))return;
  S.users=defaultUsers();saveConfig();render();toast('All passcodes reset to 1122','ok');
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='floor-backup-'+todayStr()+'.json';a.click();
}
function importJSON(input){
  const f=input.files[0];if(!f)return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const data=JSON.parse(fr.result);
      if(!data.rooms)throw 0;
      if(!confirm('Replace all current data with this backup?'))return;
      S=data;migrateConfig();baselineAll();
      Object.keys(S.days||{}).forEach(markDirty);
      saveLocal();saveConfig();pushDirty();render();toast('Backup restored & pushing','ok');
    }catch(e){toast('Invalid backup file','bad');}
  };
  fr.readAsText(f);
}
function wipeAll(){
  if(!confirm('Erase ALL data? This cannot be undone.'))return;
  if(!confirm('Really erase everything?'))return;
  dirty.clear();saveDirty();for(const k in unitSig)delete unitSig[k];
  S=defaultState();saveLocal();saveConfig();render();toast('All data erased','bad');
}
async function pingGAS(){
  setSync('syncing');const t0=Date.now();
  try{
    const r=await gas('GET',{action:'ping'},12000);
    setSync(dirty.size?'pending':'ok');
    toast(r&&r.ok?('Connected · '+(Date.now()-t0)+' ms · server '+(r.v||'?')):'Server answered but not ok',r&&r.ok?'ok':'bad');
  }catch(e){setSync('bad');toast('Cannot reach server: '+(e.name==='AbortError'?'timed out':e.message),'bad');}
}

/* =========================================================
   BOOT
   ========================================================= */
S=load();baselineAll();
initialLoad();
</script>
